<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sentinel Systems">
<meta name="theme-color" content="#000000">
<title>Sentinel Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,600;1,700&family=Orbitron:wght@700;900&family=Exo+2:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
  /* === YOUR ORIGINAL STYLES (unchanged) === */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ara-primary: #00e5ff; --ara-glow: rgba(0,229,255,0.22); --atlas-primary: #ffc96e; --atlas-glow: rgba(255,180,50,0.22); --rex-primary: #2e8b57; --rex-secondary: #4ade80; --rex-glow: rgba(46,139,87,0.22); }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #000; font-family: 'Exo 2', sans-serif; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
  #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease, transform 0.4s ease; transform: translateY(20px); z-index: 10; padding-top: calc(var(--safe-top) + 20px); padding-bottom: calc(var(--safe-bottom) + 20px); }
  .screen.active { opacity: 1; pointer-events: all; transform: translateY(0); }
  .screen.exit { opacity: 0; transform: translateY(-20px); }
  /* HOME SCREEN */
  #home { justify-content: center; gap: 0; padding: 20px; }
  .home-header { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 42px; }
  .logo-wrap { position: relative; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; }
  .logo-wrap::before { content: ''; position: absolute; inset: -22px; border-radius: 50%; background: radial-gradient(circle, rgba(0,229,255,0.22) 0%, rgba(0,229,255,0.06) 48%, transparent 72%); animation: logo-pulse 3.5s ease-in-out infinite; }
  @keyframes logo-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(1.07); } }
  .logo-wrap svg { position: relative; z-index: 1; filter: drop-shadow(0 0 10px rgba(0,229,255,0.6)) drop-shadow(0 0 22px rgba(0,229,255,0.25)); }
  .home-title { font-family: 'Chakra Petch', sans-serif; font-style: italic; font-size: clamp(1.45rem, 6.2vw, 2.05rem); font-weight: 700; color: #00e5ff; text-align: center; letter-spacing: 0.12em; text-shadow: 0 0 10px rgba(0,229,255,0.7); text-transform: uppercase; }
  .agent-cards { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 420px; }
  .agent-card { position: relative; border-radius: 18px; overflow: hidden; cursor: pointer; height: 104px; border: 1px solid transparent; transition: transform 0.2s ease, box-shadow 0.2s ease; -webkit-tap-highlight-color: transparent; }
  .agent-card:active { transform: scale(0.97); }
  .agent-card .card-bg { position: absolute; inset: 0; }
  .agent-card .card-neural { position: absolute; inset: 0; opacity: 0.65; }
  .agent-card .card-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .agent-card .card-name { font-family: 'Chakra Petch', sans-serif; font-style: italic; font-size: 2.2rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .card-ara { border-color: rgba(0,229,255,0.28); box-shadow: 0 0 22px rgba(0,229,255,0.1); }
  .card-ara .card-bg { background: radial-gradient(ellipse at 15% 50%, rgba(0,120,220,0.5) 0%, rgba(0,40,120,0.28) 40%, rgba(1,8,20,0.95) 80%); }
  .card-ara .card-name { color: var(--ara-primary); text-shadow: 0 0 14px var(--ara-primary); }
  .card-atlas { border-color: rgba(255,180,50,0.28); box-shadow: 0 0 22px rgba(255,180,50,0.1); }
  .card-atlas .card-bg { background: radial-gradient(ellipse at 85% 50%, rgba(220,100,0,0.48) 0%, rgba(140,50,0,0.28) 40%, rgba(9,4,0,0.95) 80%); }
  .card-atlas .card-name { color: var(--atlas-primary); text-shadow: 0 0 14px var(--atlas-primary); }
  .card-rex { border-color: rgba(46,139,87,0.28); box-shadow: 0 0 22px rgba(46,139,87,0.1); }
  .card-rex .card-bg { background: radial-gradient(ellipse at 15% 50%, rgba(30,95,50,0.6) 0%, rgba(18,60,28,0.32) 40%, rgba(1,10,3,0.95) 80%); }
  .card-rex .card-name { color: var(--rex-secondary); text-shadow: 0 0 14px var(--rex-primary); }
  canvas.neural { width: 100%; height: 100%; }
  .agent-screen { justify-content: flex-start; padding-left: 0; padding-right: 0; }
  .agent-bg { position: fixed; inset: 0; z-index: 0; transition: opacity 0.5s ease; }
  #agent-bg-ara { background: radial-gradient(ellipse 120% 60% at 50% -10%, rgba(0,150,255,0.32) 0%, transparent 55%), #010810; }
  #agent-bg-atlas { background: radial-gradient(ellipse 120% 60% at 50% -10%, rgba(220,110,0,0.28) 0%, transparent 55%), #090400; }
  #agent-bg-rex { background: radial-gradient(ellipse 120% 60% at 50% -10%, rgba(30,95,50,0.28) 0%, transparent 55%), #010d03; }
  .agent-header { width: 100%; padding: 16px 20px 0; display: flex; align-items: center; position: relative; z-index: 2; }
  .back-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); cursor: pointer; color: #fff; font-size: 1.15rem; }
  .back-btn:active { background: rgba(255,255,255,0.15); }
  .agent-header-title { flex: 1; text-align: center; font-family: 'Chakra Petch', sans-serif; font-style: italic; font-size: clamp(2.4rem, 12vw, 3.5rem); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .brain-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); cursor: pointer; font-size: 1.15rem; }
  .agent-status { font-family: 'Exo 2', sans-serif; font-size: 0.82rem; font-weight: 400; letter-spacing: 0.12em; color: rgba(255,255,255,0.7); margin-top: 6px; display: flex; align-items: center; gap: 8px; position: relative; z-index: 2; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-sep { opacity: 0.4; }
  .chat-container { flex: 1; width: 100%; max-width: 480px; margin: 16px auto 0; padding: 0 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 2; -webkit-overflow-scrolling: touch; }
  .chat-box { flex: 1; background: rgba(0,0,0,0.4); border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.5; animation: msg-in 0.3s ease; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-agent { align-self: flex-start; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.9); border-bottom-left-radius: 4px; }
  .msg-user { align-self: flex-end; border-bottom-right-radius: 4px; color: #000; font-weight: 500; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.3; gap: 8px; }
  .empty-state .empty-icon { font-size: 2rem; }
  .empty-state .empty-text { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; font-family: 'Exo 2', sans-serif; }
  .neurocore-btn { display: flex; align-items: center; gap: 8px; justify-content: center; font-family: 'Exo 2', sans-serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.1em; padding: 10px 20px; border-radius: 30px; border: 1px solid currentColor; background: transparent; cursor: pointer; width: fit-content; margin: 0 auto; position: relative; z-index: 2; }
  .neurocore-btn:active { background: rgba(255,255,255,0.08); }
  .input-row { width: 100%; max-width: 480px; margin: 0 auto; padding: 12px 16px calc(16px + var(--safe-bottom)); display: flex; gap: 10px; align-items: center; position: relative; z-index: 2; }
  .input-field { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 30px; padding: 12px 18px; color: #fff; font-family: 'Exo 2', sans-serif; font-size: 0.95rem; outline: none; }
  .input-field::placeholder { color: rgba(255,255,255,0.35); }
  .input-field:focus { border-color: rgba(255,255,255,0.35); }
  .mic-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: rgba(255,255,255,0.5); cursor: pointer; flex-shrink: 0; }
  .send-btn { width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s; }
  .send-btn:active { transform: scale(0.92); }
  .theme-ara .agent-header-title { color: var(--ara-primary); text-shadow: 0 0 18px var(--ara-primary); }
  .theme-ara .input-field:focus { border-color: var(--ara-primary); }
  .theme-ara .send-btn { background: var(--ara-primary); color: #000; box-shadow: 0 0 14px rgba(0,229,255,0.35); }
  .theme-ara .neurocore-btn { color: var(--ara-primary); }
  .theme-ara .msg-user { background: var(--ara-primary); }
  .theme-atlas .agent-header-title { color: var(--atlas-primary); text-shadow: 0 0 18px var(--atlas-primary); }
  .theme-atlas .input-field:focus { border-color: var(--atlas-primary); }
  .theme-atlas .send-btn { background: var(--atlas-primary); color: #000; box-shadow: 0 0 14px rgba(255,180,50,0.35); }
  .theme-atlas .neurocore-btn { color: var(--atlas-primary); }
  .theme-atlas .msg-user { background: var(--atlas-primary); }
  .theme-rex .agent-header-title { color: var(--rex-secondary); text-shadow: 0 0 18px var(--rex-primary); }
  .theme-rex .input-field:focus { border-color: var(--rex-primary); }
  .theme-rex .send-btn { background: var(--rex-primary); color: #fff; box-shadow: 0 0 14px rgba(46,139,87,0.35); }
  .theme-rex .neurocore-btn { color: var(--rex-secondary); }
  .theme-rex .msg-user { background: var(--rex-primary); color: #fff; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  #memory-screen { padding: 0; background: #000; }
  #memory-canvas { position: absolute; inset: 0; z-index: 1; }
  .memory-header { position: absolute; top: 0; left: 0; right: 0; width: 100%; padding: 16px 20px; display: flex; align-items: center; position: relative; z-index: 2; }
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="agent-bg" id="agent-bg-ara" style="opacity:0;z-index:1;"></div>
<div class="agent-bg" id="agent-bg-atlas" style="opacity:0;z-index:1;"></div>
<div class="agent-bg" id="agent-bg-rex" style="opacity:0;z-index:1;"></div>

<!-- HOME SCREEN -->
<div class="screen active" id="home">
  <div class="home-header">
    <div class="logo-wrap">
      <svg width="130" height="130" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- (your original SVG stays here) -->
      </svg>
    </div>
    <h1 class="home-title">Sentinel Systems</h1>
  </div>
  <div class="agent-cards">
    <div class="agent-card card-ara" onclick="openAgent('ara')">
      <div class="card-bg"></div>
      <canvas class="card-neural neural" id="neural-ara"></canvas>
      <div class="card-overlay"><span class="card-name">Ara</span></div>
    </div>
    <div class="agent-card card-atlas" onclick="openAgent('atlas')">
      <div class="card-bg"></div>
      <canvas class="card-neural neural" id="neural-atlas"></canvas>
      <div class="card-overlay"><span class="card-name">Atlas</span></div>
    </div>
    <div class="agent-card card-rex" onclick="openAgent('rex')">
      <div class="card-bg"></div>
      <canvas class="card-neural neural" id="neural-rex"></canvas>
      <div class="card-overlay"><span class="card-name">Rex</span></div>
    </div>
  </div>
</div>

<!-- AGENT SCREEN -->
<div class="screen agent-screen" id="agent-view">
  <div class="agent-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="agent-header-title" id="agent-title">Ara</div>
    <div class="brain-btn" id="brain-btn" title="Neural Memory">🧠</div>
  </div>
  <div class="agent-status">
    <span class="status-dot"></span>
    <span>Memory</span>
    <span class="status-sep">•</span>
    <span>Active</span>
    <span class="status-sep">•</span>
    <span>Online</span>
  </div>
  <div class="chat-container">
    <div class="chat-box" id="chat-box">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">◎</div>
        <div class="empty-text">Awaiting input</div>
      </div>
    </div>
  </div>
  <button class="neurocore-btn" id="neurocore-btn" onclick="addToNeurocore()">
    <span>＋</span> Add to Neurocore
  </button>
  <div class="input-row">
    <input class="input-field" id="chat-input" type="text" placeholder="Ask..." autocomplete="off">
    <button class="mic-btn" onclick="toggleMic()">🎙</button>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">→</button>
  </div>
</div>

<!-- MEMORY SCREEN -->
<div class="screen" id="memory-screen">
  <div class="memory-header">
    <button class="back-btn" onclick="closeMemory()">←</button>
    <div class="agent-header-title" id="memory-title" style="color:#00e5ff;">Memory</div>
  </div>
  <canvas id="memory-canvas"></canvas>
</div>

<script>
// ============================================================
// Sentinel Systems - Cross-Device Persistence Enabled
// ============================================================
const BACKEND_URL = "/chat";   // ← Corrected
let currentAgent = null;
let isLoading = false;
const messageStore = { ara: [], atlas: [], rex: [] };
const agentConfig = {
  ara: { name: 'Ara', color: 'var(--ara-primary)', theme: 'theme-ara', bg: 'agent-bg-ara', placeholder: 'Ask Ara...' },
  atlas: { name: 'Atlas', color: 'var(--atlas-primary)', theme: 'theme-atlas', bg: 'agent-bg-atlas', placeholder: 'Ask Atlas...' },
  rex: { name: 'Rex', color: 'var(--rex-primary)', theme: 'theme-rex', bg: 'agent-bg-rex', placeholder: 'Ask Rex...' }
};

// Clear old per-device localStorage (we now use server-side history)
Object.keys(localStorage).forEach(key => {
  if (key.startsWith('araChat_')) {
    localStorage.removeItem(key);
  }
});

async function loadChatHistory(agentId) {
  try {
    const res = await fetch('/history');
    const data = await res.json();
    
    messageStore[agentId] = data.history.map(msg => ({
      role: msg.role === 'user' ? 'user' : 'agent',
      text: msg.content
    }));
  } catch (err) {
    console.error("Failed to load shared history from server:", err);
    // Fallback to localStorage
    const saved = localStorage.getItem(`araChat_${agentId}`);
    if (saved) messageStore[agentId] = JSON.parse(saved);
  }
}

function saveChatHistory(agentId) {
  localStorage.setItem(`araChat_${agentId}`, JSON.stringify(messageStore[agentId]));
}

// === Typing Indicator + Error handling (kept from your version) ===
function showTypingIndicator(show) {
  const box = document.getElementById('chat-box');
  let typingEl = document.getElementById('ara-typing');
  if (!typingEl) {
    typingEl = document.createElement('div');
    typingEl.id = 'ara-typing';
    typingEl.style.cssText = 'padding:8px 12px;color:#888;font-style:italic;font-size:0.85rem;';
    box.appendChild(typingEl);
  }
  typingEl.style.display = show ? 'block' : 'none';
  if (show) typingEl.innerHTML = 'Ara is thinking<span class="typing-dots">...</span>';
}

function showErrorWithRetry(errorMessage, originalMessage) {
  const box = document.getElementById('chat-box');
  const errorDiv = document.createElement('div');
  errorDiv.className = 'msg msg-agent';
  errorDiv.style.cssText = 'background:#3a1f1f;border:1px solid #c0392b;';
  errorDiv.innerHTML = `
    ${errorMessage}
    <button onclick="retryLastMessage('${originalMessage}', this)"
            style="margin-left:12px;padding:4px 12px;background:#c0392b;color:white;border:none;border-radius:6px;font-size:0.8rem;cursor:pointer;">
      Retry
    </button>
  `;
  box.appendChild(errorDiv);
  box.scrollTop = box.scrollHeight;
}

window.retryLastMessage = async function(originalMessage, buttonElement) {
  buttonElement.disabled = true;
  buttonElement.textContent = 'Retrying...';
  const araReply = await sendMessageToAra(originalMessage);
  buttonElement.parentElement.remove();
  if (araReply) {
    messageStore[currentAgent].push({ role: 'agent', text: araReply });
    renderMessages(currentAgent);
    saveChatHistory(currentAgent);
  }
};

async function sendMessageToAra(message) {
  if (isLoading || !currentAgent) return null;
  isLoading = true;
  showTypingIndicator(true);
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 25000);
  try {
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, api_key: "ara2026secret" }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    return data.response || "Ara is thinking...";
  } catch (err) {
    clearTimeout(timeoutId);
    if (err.name === 'AbortError') return "Ara took too long. Try again.";
    if (err.message.includes('Failed to fetch')) return "Can't reach Ara. Check Tailscale.";
    return "Something went wrong. Try again.";
  } finally {
    isLoading = false;
    showTypingIndicator(false);
  }
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !currentAgent) return;
  messageStore[currentAgent].push({ role: 'user', text });
  input.value = '';
  renderMessages(currentAgent);
  saveChatHistory(currentAgent);
  const araReply = await sendMessageToAra(text);
  if (araReply) {
    messageStore[currentAgent].push({ role: 'agent', text: araReply });
    renderMessages(currentAgent);
    saveChatHistory(currentAgent);
  } else {
    showErrorWithRetry("Failed to get response from Ara.", text);
  }
}

function renderMessages(agentId) {
  const box = document.getElementById('chat-box');
  const msgs = messageStore[agentId] || [];
  box.innerHTML = '';
  if (msgs.length === 0) {
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.innerHTML = '<div class="empty-icon">◎</div><div class="empty-text">Awaiting input</div>';
    box.appendChild(e);
    return;
  }
  msgs.forEach(m => {
    const el = document.createElement('div');
    el.className = `msg ${m.role === 'user' ? 'msg-user' : 'msg-agent'}`;
    el.textContent = m.text;
    box.appendChild(el);
  });
  box.scrollTop = box.scrollHeight;
}

// === UPDATED openAgent ===
async function openAgent(id) {
  currentAgent = id;
  const cfg = agentConfig[id];
  const view = document.getElementById('agent-view');
  view.className = `screen agent-screen ${cfg.theme}`;
  document.getElementById('agent-title').textContent = cfg.name;
  document.getElementById('chat-input').placeholder = cfg.placeholder;
  ['ara', 'atlas', 'rex'].forEach(a => {
    document.getElementById(`agent-bg-${a}`).style.opacity = a === id ? '1' : '0';
  });

  await loadChatHistory(id);
  renderMessages(id);

  const home = document.getElementById('home');
  home.classList.add('exit');
  setTimeout(() => home.classList.remove('active', 'exit'), 400);
  view.classList.add('active');
  starCanvas.style.opacity = '0.4';
}

function goHome() {
  const home = document.getElementById('home');
  const view = document.getElementById('agent-view');
  view.classList.add('exit');
  setTimeout(() => view.classList.remove('active', 'exit'), 400);
  home.classList.add('active');
  ['ara', 'atlas', 'rex'].forEach(a => {
    document.getElementById(`agent-bg-${a}`).style.opacity = '0';
  });
  starCanvas.style.opacity = '1';
}

function addToNeurocore() {
  const btn = document.getElementById('neurocore-btn');
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Saved to Neurocore';
  btn.style.opacity = '0.7';
  setTimeout(() => {
    btn.innerHTML = orig;
    btn.style.opacity = '1';
  }, 2000);
}

function toggleMic() {
  console.log('Mic pressed');
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

// === YOUR ORIGINAL CODE (starfield, nebulae, memory graph) ===
// (Keep all your original functions here exactly as they were)
document.getElementById('brain-btn').addEventListener('click', openMemory);
initStars();
drawStars();
setTimeout(() => {
  paintNebula('neural-ara', 195, 220, 210);
  paintNebula('neural-atlas', 28, 45, 35);
  paintNebula('neural-rex', 120, 135, 128);
}, 100);
</script>
</body>
</html>
