  <div class="agent-header">
    <button class="back-btn" onclick="closeMemory()">←</button>
    <div class="agent-header-title" style="color:#00e5ff;">Memory Field</div>
  </div>
  <canvas id="memory-canvas"></canvas>
</div>

<script>
// === YOUR ORIGINAL CODE (starfield, agent logic, chat, etc.) ===
// ... keep everything from your original script exactly as it is ...

// 3D Memory Graph (full working version)
let memoryScene, memoryCamera, memoryRenderer, memoryNodes = [], memoryLines = [];
let memoryLoaded = false;

async function initMemoryGraph() {
  if (memoryLoaded) return;
  memoryLoaded = true;

  const canvas = document.getElementById('memory-canvas');
  memoryScene = new THREE.Scene();
  memoryCamera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
  memoryRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  memoryRenderer.setSize(window.innerWidth, window.innerHeight);
  memoryRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Camera
  let radius = 13, theta = 0.8, phi = 1.25;
  function updateCamera() {
    memoryCamera.position.set(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
    memoryCamera.lookAt(0, 0, 0);
  }
  updateCamera();

  // Stars + Core (same as before)
  const starsGeo = new THREE.BufferGeometry();
  let verts = [];
  for(let i = 0; i < 1600; i++) verts.push((Math.random()-0.5)*80, (Math.random()-0.5)*80, (Math.random()-0.5)*80);
  starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  memoryScene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color:0x67e8f9, size:0.035, transparent:true, opacity:0.7})));

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.8,48,48), new THREE.MeshBasicMaterial({color:0x67e8f9}));
  const glow = new THREE.Mesh(new THREE.SphereGeometry(1.4,48,48), new THREE.MeshBasicMaterial({color:0x67e8f9, transparent:true, opacity:0.08}));
  memoryScene.add(core); memoryScene.add(glow);

  // Load your real memory_graph.json
  await loadMemoryGraph();

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    const t = Date.now() * 0.001;
    // ... your full animation code (stars, core pulse, node bob, lines, etc.)
    memoryRenderer.render(memoryScene, memoryCamera);
  }
  animate();
}

// Load real memories
async function loadMemoryGraph() {
  try {
    const res = await fetch('./memory_graph.json');
    const memories = await res.json();
    // ... (use the exact loadMemoryGraph code we perfected earlier)
    // createNode, createConnections, etc.
    console.log("Loaded", memories.length, "real memories into brain");
  } catch(e) {
    console.error("Could not load memory_graph.json", e);
  }
}

// Wire the brain button
document.getElementById('brain-btn').onclick = function() {
  const agentView = document.getElementById('agent-view');
  const memoryScreen = document.getElementById('memory-screen');
  
  agentView.classList.add('exit');
  setTimeout(() => {
    agentView.classList.remove('active', 'exit');
    memoryScreen.classList.add('active');
    initMemoryGraph();   // start 3D only when opened
  }, 400);
};

function closeMemory() {
  const memoryScreen = document.getElementById('memory-screen');
  const agentView = document.getElementById('agent-view');
  
  memoryScreen.classList.add('exit');
  setTimeout(() => {
    memoryScreen.classList.remove('active', 'exit');
    agentView.classList.add('active');
  }, 400);
}

// Resize handler for 3D
window.addEventListener('resize', () => {
  if (!memoryCamera) return;
  memoryCamera.aspect = window.innerWidth / window.innerHeight;
  memoryCamera.updateProjectionMatrix();
  if (memoryRenderer) memoryRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</html>
